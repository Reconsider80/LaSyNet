# CVPR-method retrain (synthetic stand-in; replace dataset/data_root with TN3K when available)

dataset: synthetic
num_samples: 1024
image_size: 128
num_classes: 1
batch_size: 8
num_workers: 4

image_channels: 1
latent_dim: 4
seg_channels: 32
time_emb_dim: 256
beta: 1.0
lambda_seg: 0.5

vae_base_channels: 32
vae_channel_mult: [1, 2, 4]
vae_num_res_blocks: 2
vae_kl_weight: 0.0

unet_model_channels: 32
unet_channel_mult: [1, 2, 4]
unet_num_res_blocks: 2
freeze_backbone: false
gsii_num_heads: 4

seg_base_channels: 32
seg_downsample_steps: 2

epochs: 100
lr: 1.0e-4
weight_decay: 1.0e-2
scheduler: cosine
lr_min: 1.0e-6
amp: true
use_tensorboard: true
save_every: 10

num_steps: 25
